name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/simulators.json
          python3 - <<'PYTHON'
          import json, os
          devices = json.load(open('/tmp/simulators.json'))['devices']
          phones = [d for runtime in sorted(devices, reverse=True) if 'iOS' in runtime
                    for d in devices[runtime] if d['name'].startswith('iPhone') and d.get('isAvailable')]
          if not phones:
              raise SystemExit('No available iPhone simulator runtime')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TEST_SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          print('Selected ' + phones[0]['name'])
          PYTHON

      - name: Run unit and integration tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project OpenResponses.xcodeproj \
            -scheme OpenResponses \
            -destination "platform=iOS Simulator,id=$TEST_SIMULATOR_ID" \
            -only-testing:OpenResponsesTests \
            -parallel-testing-enabled NO \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-and-integration-results
          path: TestResults.xcresult
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew list swiftlint || brew install swiftlint
      - run: swiftlint lint --reporter github-actions-logging
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: |
          if grep -rqE "sk-[a-zA-Z0-9]{48}" --include="*.swift" --include="*.json" .; then
            echo "❌ Potential API key found"; exit 1
          fi
          echo "✅ No secrets found"

  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          for f in README.md LICENSE PRIVACY.md; do
            [ -f "$f" ] && echo "✅ $f" || { echo "❌ Missing $f"; exit 1; }
          done
