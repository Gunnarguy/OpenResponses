name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A manual run tests main without a push. A push without [ci skip] also starts the Xcode Cloud archives,
  # so while a version is in review, push with [ci skip] and start this by hand: gh workflow run ci.yml --ref main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    # Same toolchain as the App Store archive: the Xcode Cloud workflow "Default" builds with
    # "Latest Release", which was Xcode 27.0 (27A266a) on macOS 26A428 on 2026-09-28, and the
    # xcode-27 image (a GitHub preview, so jobs can queue) carries exactly that pair with iOS 27.0
    # simulators. Earlier, macos-15's Xcode 26.3 and iOS 26.2 simulator aborted when a synchronous
    # XCTest released a @MainActor class (swift_task_deinitOnExecutor, swiftlang/swift#87316).
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Bump together with the Xcode Cloud workflow's Xcode.
          xcode-version: '27.0'

      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/simulators.json
          python3 - <<'PYTHON'
          import json, os
          devices = json.load(open('/tmp/simulators.json'))['devices']
          phones = [d for runtime in sorted(devices, reverse=True) if 'iOS' in runtime
                    for d in devices[runtime] if d['name'].startswith('iPhone') and d.get('isAvailable')]
          if not phones:
              raise SystemExit('No available iPhone simulator runtime')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TEST_SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          print('Selected ' + phones[0]['name'])
          PYTHON

      - name: Run unit and integration tests
        # BrowserLiveSiteTests loads example.com and iana.org in WebKit. Hosted runners lose that
        # network path often enough to fail unrelated pushes (runs 34267002652 and 35919359539),
        # so it runs locally instead of here.
        # Signed ad hoc ("Sign to Run Locally"; no certificate or account needed), not CODE_SIGNING_ALLOWED=NO:
        # an unsigned test host can't see StoreKit's test environment, so the Pro purchase test found no
        # transaction at all (run 45094038015; reproduced locally 2026-11-23, unsigned fails, signed passes).
        # The runner's simulator is new every time, and the first StoreKit test run on a new simulator also sees
        # no transactions (run 45243865014 skipped it; reproduced locally: missed once, then passed twice). So the
        # purchase test runs once as a warm-up that may miss, and the real run requires it to pass.
        run: |
          set -o pipefail
          COMMON=(-project OpenResponses.xcodeproj -scheme OpenResponses
            -destination "platform=iOS Simulator,id=$TEST_SIMULATOR_ID" -derivedDataPath DerivedData)
          xcodebuild build-for-testing "${COMMON[@]}" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
          xcodebuild test-without-building "${COMMON[@]}" \
            -only-testing:OpenResponsesTests/ProAccessTests/testPurchaseUnlocksAndRefundLocksAgain \
            || echo "StoreKit warm-up run missed, as expected on a new simulator"
          TEST_RUNNER_REQUIRE_STOREKIT=1 xcodebuild test-without-building "${COMMON[@]}" \
            -only-testing:OpenResponsesTests \
            -skip-testing:OpenResponsesTests/BrowserLiveSiteTests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-and-integration-results
          path: TestResults.xcresult
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew list swiftlint || brew install swiftlint
      - run: swiftlint lint --reporter github-actions-logging
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: |
          if grep -rqE "sk-[a-zA-Z0-9]{48}" --include="*.swift" --include="*.json" .; then
            echo "❌ Potential API key found"; exit 1
          fi
          echo "✅ No secrets found"

  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          for f in README.md LICENSE PRIVACY.md; do
            [ -f "$f" ] && echo "✅ $f" || { echo "❌ Missing $f"; exit 1; }
          done
